version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=crm_password
      - POSTGRES_DB=crm_db
    ports:
      - "5432:5432" # Opcional: expõe o banco para seu PC (útil para debug)

  backend:
    build: .
    volumes:
      - .:/code # Mapeia sua pasta local para o container (Hot Reload funciona!)
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=crm_password
      - POSTGRES_DB=crm_db
      - SECRET_KEY=sua_chave_secreta_super_segura_aqui
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - BACKEND_CORS_ORIGINS=*
    depends_on:
      - db

volumes:
  postgres_data:

